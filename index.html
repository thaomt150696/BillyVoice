<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Bộ hình minh họa của BillyVoice (D27, D28, D29). Khác icons.svg: lớn hơn, nhiều lớp màu, nhưng vẫn nhẹ.
    - LINH VẬT: Billy là chú LÁ MẦM tròn xoe (thân tròn, hai lá non trên đầu, hai chân nhỏ). Khung 100 × 100.
      Thân (#bv-billy-base) và lá (#bv-billy-leaves) dùng chung; mỗi biểu cảm là một symbol riêng ghép thân + lá + mặt + tay:
        #bv-billy          Vui (mặc định)        #bv-billy-wave    Vẫy tay chào
        #bv-billy-listen   Lắng nghe             #bv-billy-think   Suy nghĩ
        #bv-billy-wow      Ngạc nhiên            #bv-billy-sleepy  Buồn ngủ
        #bv-billy-cheer    Hoan hô               #bv-billy-unsure  Chưa chắc
      Đặt vào cảnh bằng <use href="#bv-billy-wave" x y width height/>. Sửa thân hoặc lá một chỗ là mọi biểu cảm cùng đổi.
    - Cảnh: khung 160 × 120. Hiển thị bằng lớp .bv-ill (160 × 120) hoặc .bv-ill--sm (120 × 90) trong components.css.
    - Mọi màu lấy từ tokens.css qua var(--bv-…), nên tự đổi theo bản sáng / tối. KHÔNG viết mã màu trực tiếp (kể cả #hex).
      Lá dùng --bv-leaf / --bv-leaf-soft (chỉ để trang trí, không mang nghĩa Thu / Chi, D29).
    - Màu nhấn (--bv-primary) CHỈ dành cho nút MIC trong cảnh, đúng quy tắc D18. Billy không dùng màu nhấn. Màn lỗi không dùng Billy.
    - Không có chữ trong hình (không phụ thuộc font, không phải dịch).
    - Chỉ để trang trí: luôn đặt aria-hidden="true" focusable="false"; chữ của màn hình đã nói đủ ý.
    - Dùng: <svg class="bv-ill" aria-hidden="true" focusable="false"><use href="#bv-ill-welcome"/></svg>
    - Khi build, tách file này ra và gọi: <use href="illustrations.svg#bv-ill-welcome"/>
    - Nét: màu chữ phụ (muted), dày 2 (Billy dày 3 trong khung 100); khối phụ dùng soft / surface / tint / leaf-soft.
  -->

  <!-- ===== Linh vật Billy: bộ phận dùng chung ===== -->

  </symbol>
  <symbol id="bv-billy-leaves" viewBox="0 0 100 100">
